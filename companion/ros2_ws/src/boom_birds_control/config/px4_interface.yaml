# px4_interface_node 参数（第一版默认值）
#
# 用法：
#   ros2 run boom_birds_nav px4_interface_node --ros-args --params-file <此文件>
#
# 数值来源（A2 单一来源）：
#   失效阈值与话题/坐标系的**唯一**定义点是 config/runtime.yaml 的校验对象
#   （boom_birds_nav.runtime_config.RuntimeConfig）。本文件只能引用同一数值，
#   不得自成一套；test/test_config_single_source.py 会逐个比对（含"未登记的
#   失效阈值"检查）。要改数值请改 runtime.yaml，不要只改这里。
#
# 安全默认值（不要为了"跑通"而改）：
#   backend: fake      —— 默认不连任何东西
#   dry_run: true      —— 即使选了 mavlink 也只构造不下发
#   allow_arming: false —— 解锁必须显式打开，且只允许回环地址
#
# 只发高层 setpoint（需求 FC-004）：本节点与 Px4Backend 都没有 PWM/DShot/电机指令接口。

boom_birds_px4_interface:
  ros__parameters:
    # ---------------------------------------------------------------- 话题
    position_cmd_topic: "/position_cmd"                  # EGO traj_server 输出（frame_id=world）

    # ---- 局部系对齐（P1-2）----
    # 轴翻转只解决"哪个轴朝哪"；原点与水平朝向**不会**自动一致。
    #   none                 : 不声明对齐（默认，最保守）→ 不下发位置 setpoint
    #   declared             : 声明 yaw 偏移，仍要求实测残差核实
    #   identity             : 显式声明"两系同向且原点重合"，仍要求核实
    #   unverified_test_only : 仅 Fake 后端或 MAVLink dry_run；跳过闸门并打 ERROR
    frame_alignment: "none"
    # 水平朝向（航向）已核实。注意：这只覆盖**航向**，不代表原点正确。
    frame_alignment_observed: false
    # 原点/平移关系的**证据**。航向核实证明不了原点（两系可以朝向一致但原点相隔很远）。
    # true = 已核实原点关系（例如 EKF 原点已由外部视觉融合定义在 VIO 原点上，
    # 或已用实测数据标定出 frame_alignment_translation_m）。
    # 未置位时位置 setpoint **不会**被放行。
    frame_alignment_origin_evidence: false
    # 原点证据的说明（写进状态，便于复核"是谁、凭什么核实的"）
    frame_alignment_origin_note: ""
    # PX4 重启会使两项证据失效并闭锁；重新核实后重启本节点。
    frame_alignment_yaw_offset_rad: 0.0
    frame_alignment_translation_m: [0.0, 0.0, 0.0]
    frame_alignment_tolerance_rad: 0.0872664626    # 5°
    frame_alignment_required_samples: 10
    frame_alignment_max_tilt_rad: 0.35             # 20°
    frame_alignment_max_yaw_rate_rad_s: 0.5

    # ---------------------------------------------------------------- 控制
    control_rate_hz: 50.0        # 需求 FC-005 目标 50–100 Hz；实际频率需实测核定
    yaw_mode: "yaw"              # yaw | yaw_rate；两者同时下发会被 PX4 忽略
    send_acceleration: true      # EGO 提供加速度前馈；置 false 只发位置+速度

    # ---------------------------------------------------------------- 后端（SW-001 隔离点）
    backend: "fake"              # fake | mavros
    dry_run: true                # mavlink 后端默认只构造不下发
    fcu_url: "udp://127.0.0.1:14540@127.0.0.1:14580"   # 仅回环；非回环需显式放开（见 MavrosPx4Backend）
    allow_arming: false          # 解锁总开关；默认关闭
    read_timeout_s: 0.05         # 后端 read() 阻塞上限；不是失效阈值

    # ---------------------------------------------------------------- 失效阈值
    # 全部等于 RuntimeConfig 对应字段（test_config_single_source.py 逐个比对）：
