# 运行参数唯一来源（由 RuntimeConfig 提供校验）。
#
# 本文件的数值必须与 boom_birds_control/runtime_config.py 的默认值逐一相等，
# test_runtime_config.py 会强制这一点。contract.yaml 只描述消息/单位/坐标系/
# 无效值语义，不再重复这里的时间阈值；节点与 launch 只引用本文件。
#
# 这些是 **SIH 初始配置**，不是实机验收阈值。
#
# 高度参考系（三者独立，不可互相代替）：
#   takeoff_altitude_agl_m         PX4 MIS_TAKEOFF_ALT；相对起飞点地面，向上为正
#   hold_lock_min_altitude_agl_m   相对本任务起飞点地面；锁点前的相对高度下限
#   image_publish_min_altitude_agl_m 相对本任务起飞点地面；合成输入发布下限
#   recovery_min_altitude_agl_m    相对本任务起飞点地面；自动恢复相对高度下限

world_frame: global
camera_frame: cam0_rect
body_frame: body
depth_topic: /boom_birds/depth/image
camera_info_topic: /boom_birds/depth/camera_info
