executor_status_topic: /boom_birds/planner/executor_status
planner_status_topic: /boom_birds/planner/status
status_topic: /boom_birds/control/execution_status
mission_status_topic: /boom_birds/mission/status
control_status_topic: /boom_birds/control/status
action_service: /boom_birds/control/action
mission_service: /boom_birds/mission
raw_left_frame: cam0
raw_right_frame: cam1
stereo_left_topic: /boom_birds/stereo/left_raw
stereo_right_topic: /boom_birds/stereo/right_raw
stereo_stitched_topic: /boom_birds/stereo/stitched
stereo_status_topic: /boom_birds/stereo/source_status
depth_xyz_topic: /boom_birds/depth/xyz
depth_xyz_valid_topic: /boom_birds/depth/xyz_valid
