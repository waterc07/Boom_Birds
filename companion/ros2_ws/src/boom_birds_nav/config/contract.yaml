frames:
  world: global
  imu: imu
  body: body
  cam0: cam0
  cam1: cam1
  cam0_rect: cam0_rect
transform_chain:
  camera: T_W_Crect = T_W_I · T_I_C0 · T_C0_Crect
  body: T_W_B = T_W_I · T_I_B
  velocity_body: v_W_B = v_W_I + R_W_I (omega_I × p_I_B)
  notes:
  - T_I_C0 即 Kalibr/OpenVINS 的 T_imu_cam 字段（已核验 VioManagerOptions.h:263-269）
  - OpenVINS 的 odomimu.twist.linear 是 IMU 局部系速度（发布前已从 v_IinG 旋转）
topics:
- name: /boom_birds/stereo/left_raw
  type: sensor_msgs/Image
  encoding: mono8
  frame_id: cam0
  qos:
    reliability: reliable
    depth: 10
  note: 原始左目，未校正；与右目同帧共享时间戳
  source: 唯一采集源：stereo_source 的 v4l2（真机）/ replay（保存帧）/ synth（TEST-ONLY）模式之一；绝不允许两个消费者各自打开相机
  timestamp: v4l2 模式来自 V4L2 驱动时间戳（VIDIOC_DQBUF 的 v4l2_buffer.timestamp）并映射到 ROS 时域；不是
    OpenCV 取帧返回时刻，也不是发布时间。replay 模式为回放器合成的单调时刻（记录帧不含曝光时间戳）
  exposure: V4L2 时间戳与真实曝光时刻的偏差未标定；需外部触发/闪光或与 IMU 相关峰对齐后另行验证，不得声称等于曝光中点
- name: /boom_birds/stereo/right_raw
  type: sensor_msgs/Image
  encoding: mono8
  frame_id: cam1
  qos:
    reliability: reliable
    depth: 10
  note: 原始右目，未校正；与左目同帧共享同一时间戳（同一帧只有一个采集时间戳）
- name: /boom_birds/stereo/stitched
  type: sensor_msgs/Image
  encoding: mono8
  frame_id: cam0
  qos:
    reliability: reliable
    depth: 10
  note: 调试用拼接图，唯一采集源的原始帧
- name: /boom_birds/stereo/left_raw/camera_info
  type: sensor_msgs/CameraInfo
  frame_id: cam0
  qos: &id001
    reliability: reliable
    depth: 10
  note: 原始（未校正）左目内参，由标定 K1/D1 推导；**与左图同话题前缀配对**，不再与右目轮流发在同一话题上
  consistency: '采集分辨率与标定 image_size 不一致时按 采集宽度/标定宽度 缩放 fx/fy/cx/cy并记入诊断（raw_info_scale:
    auto）；**米制物理基线不缩放**（纯降采样不改变刚体量）。scale=1.0 时尺寸不符直接报错。跨分辨率复用内参只有在小尺寸是大尺寸的纯降采样时才近似成立，真机必须按实际分辨率重新标定'
- name: /boom_birds/stereo/right_raw/camera_info
  type: sensor_msgs/CameraInfo
  frame_id: cam1
  qos: *id001
  note: 原始（未校正）右目内参，由标定 K2/D2 推导；P[0][3] = -fx_当前分辨率 · B_物理
  consistency: '采集分辨率与标定 image_size 不一致时按 采集宽度/标定宽度 缩放 fx/fy/cx/cy并记入诊断（raw_info_scale:
    auto）；**米制物理基线不缩放**（纯降采样不改变刚体量）。scale=1.0 时尺寸不符直接报错。跨分辨率复用内参只有在小尺寸是大尺寸的纯降采样时才近似成立，真机必须按实际分辨率重新标定'
- name: /boom_birds/stereo/camera_info
  type: sensor_msgs/CameraInfo
  frame_id: cam0 / cam1
  deprecated: true
  note: '**已弃用**：旧版把左右轮流发在同一话题，下游只能靠 frame_id 猜，与 ROS 的「一个相机一个 camera_info 话题」惯例不符。默认关闭，仅在显式配置
    legacy_combined_camera_info_topic 时发布，供旧订阅者过渡'
- name: /boom_birds/stereo/source_status
  type: std_msgs/String
  note: JSON 诊断：模式、协商格式、驱动时域、采集/发布/丢帧计数、时间戳拒绝次数、内参缩放比、最近错误
- name: /boom_birds/control/status
  type: std_msgs/String
  note: JSON 状态（px4_interface_node）：安全状态、allow_setpoint、失效原因与年龄、后端诊断、计数。allow_setpoint=false
    只表示本节点停发 setpoint，不代表 PX4 已悬停或已接管
- name: /boom_birds/imu
  type: sensor_msgs/Imu
  frame_id: imu
  units:
    angular_velocity: rad/s
    linear_acceleration: m/s^2
  qos:
    reliability: best_effort
    depth: 5
  note: 飞控 IMU 为确定来源；不发布融合姿态，orientation 不参与解算
  source: 真实链路为 PX4 HIGHRES_IMU（MAVLink）经 mavlink_imu_node 接收；TEST-ONLY 的 vio_source
    只是脱机替身，两者不得同时运行在同一话题上
  frame_convention: 机体系 FRD（与 PX4 vehicle_imu 一致）；linear_acceleration 是比力且含重力反作用，静止水平时
    z ≈ +9.81 m/s^2，不再做任何旋转/单位换算
  timestamp: 由 HIGHRES_IMU.time_usec（PX4 启动时钟微秒）经 TIMESYNC 偏移与 ROS 时钟映射得到；绝不使用串口收包时刻
  orientation: 按 ROS 约定标为不可用（orientation_covariance[0] = -1）；不使用飞控 EKF 融合姿态
  invalid_policy: 无可靠时钟映射、字段校验失败或时间戳不单调时拒绝发布，不做近似时间戳；原因见下面的诊断话题
- name: /boom_birds/imu/mavlink_status
  type: std_msgs/String
  note: JSON 诊断（mavlink_imu_node）：imu_rate_hz、消息间隔与丢样、TIMESYNC RTT/偏移/样本年龄/误差上界、时间回退与映射失效计数、heartbeat
    状态
- name: /boom_birds/imu/diagnostics
  type: diagnostic_msgs/DiagnosticArray
  note: 同一套诊断的 diagnostic_msgs 摘要，便于标准工具链查看
- name: /boom_birds/ov/odomimu
  type: nav_msgs/Odometry
  frame_id: global
  child_frame_id: imu
  qos:
    reliability: best_effort
    depth: 5
  note: OpenVINS 输出；twist.linear 为 IMU 局部系速度
- name: /boom_birds/depth/image
  type: sensor_msgs/Image
  encoding: 32FC1
  frame_id: cam0_rect
  units: m
  qos:
    reliability: reliable
    depth: 10
  invalid: NaN
  note: 光轴深度 Z；**无效观测保持 NaN**（公共契约）。需要 0 值流的消费者用下面的兼容话题
- name: /boom_birds/depth/image_compat_uint16_mm
  type: sensor_msgs/Image
  encoding: 16UC1
  frame_id: cam0_rect
  units: mm
  qos:
    reliability: reliable
    depth: 10
  invalid: 0
  note: 兼容话题：无效位置写整数 0（无回波）；主话题保持 32FC1/米/NaN
- name: /boom_birds/depth/xyz
  type: sensor_msgs/PointCloud2
  frame_id: cam0_rect
  units: m
  layout: height=240, width=320, 行优先 index=v*W+u
  is_dense: false
  invalid: 三分量 NaN
  qos:
    reliability: reliable
    depth: 10
- name: /boom_birds/depth/xyz_valid
  type: sensor_msgs/PointCloud2
  frame_id: cam0_rect
  is_dense: true
  note: 附加输出；仅有效点。不得替代主点云
- name: /boom_birds/depth/camera_info
  type: sensor_msgs/CameraInfo
  frame_id: cam0_rect
  note: 由同一标定的 P1 推导（320×240），供 EGO grid_map 的 fx/fy/cx/cy 使用
- name: /boom_birds/vio/camera_pose
  type: geometry_msgs/PoseStamped
  frame_id: global
  qos:
    reliability: reliable
    depth: 10
  note: 校正左相机光学系位姿；EGO grid_map/pose（pose_type=1）直接按相机位姿使用
- name: /boom_birds/vio/odom_body
  type: nav_msgs/Odometry
  frame_id: global
  child_frame_id: body
  twist_frame: body
  qos:
    reliability: reliable
    depth: 10
  note: 标准机体里程计，twist 表达在子系
- name: /boom_birds/vio/odom_ego
  type: nav_msgs/Odometry
  frame_id: global
  child_frame_id: body
  twist_frame: global
  qos:
    reliability: reliable
    depth: 10
  note: EGO 专用适配输出；EGO 的 odom_world 回调按世界系使用速度，故与标准里程计分开命名
timing:
  camera_imu_offset_s: 0.0
  apply_camera_imu_offset: false
  imu_max_offset_age_s: 1.0
  imu_max_rtt_s: 0.02
  imu_max_offset_deviation_s: 0.05
  pose_depth_tolerance_s: 0.03
  pose_wait_s: 0.5
  depth_max_age_s: 0.5
  pose_timeout_s: 0.15
  depth_timeout_s: 1.0
  sim_time: 默认 false；回放 bag 时可选 use_sim_time=true，需同时发布 /clock
  notes:
  - 位姿缓冲按采集时间配对，处理延迟由 pose_wait_s 吸收，不放宽采集时间容差。
  - 真机需按飞控 IMU、双目及 OpenVINS 实测频率重新核定时间参数。
  - 运行时检查配对拒绝、数据过旧、未来戳与最近配对差统计。
  - IMU 侧同步精度只能用 TIMESYNC RTT/2 量级描述，未在真机测量前不得写成实测同步误差。
  - 相机帧时间戳必须来自 V4L2 驱动（见 camera_timestamp.py）；OpenCV 取帧返回时刻与 ROS 发布时间都不是曝光时间。
  - IMU 侧同步精度只能用 TIMESYNC RTT/2 量级描述；未在真机测量前不得写成实测同步误差。
  - 相机帧时间戳必须来自 V4L2 驱动；OpenCV 取帧返回时刻与 ROS 发布时间都不是曝光时间。
invalid_policy:
  array_level: NaN（深度与 XYZ 数组）
  ros_depth_image: 主话题保持 NaN（公共契约）；0.0 仅出现在兼容话题，绝不表示近处障碍或自由空间
  match_failure: 不从匹配失败推断自由空间
  over_range: 匹配有效且 z > max_depth_m 视为超量程观测，与匹配失败分开统计
  map_side: EGO grid_map 必须跳过无效观测：不产生障碍端点，也不沿其射线清空地图
control:
  note: 规划输出 → 飞控高层 setpoint。三个必须显式区分的概念：停发 setpoint（Companion 行为）≠ 飞控悬停 ≠ 飞控安全接管；控制器放在
    Companion 还是 PX4 未定案，因此后端隔离在 Px4Backend 协议之后；只允许高层控制，禁止任何 PWM/DShot/电机指令（需求 FC-004）
  input_topic: /position_cmd
  input_frame: world
  output_frame: MAV_FRAME_LOCAL_NED
  frame_conversion: 见 px4_frames.py 与其单测：轴向映射与偏航符号由测试锁定；原点关系未标定，按相对同一局部原点处理
  allowed_commands: 高层 setpoint（位置/速度/加速度/偏航或偏航率）、模式切换、解锁/上锁命令；不包含任何电机/执行器指令
  setpoint_rate_hz: 50
  invalid_behavior:
  - 规划拒绝 / 轨迹失效 / setpoint 过期：立即停发并发布原因
  - VIO、IMU、相机断流或 MAVLink 链路超时：停发并进入失效状态
  - 飞控重启：需要完整的重新建立过程，不自动沿用旧状态
  - 恢复需要连续多次新鲜评估（迟滞），避免抖动反复使能
  verification_required:
  - 本节点侧只验证停发与状态发布；PX4 侧的实际反应（COM_OF_LOSS_T 默认 1.0 s、COM_OBL_RC_ACT 默认 Position）必须在
    SITL 与实机分别验证
  - 坐标系转换、偏航符号与量纲需在 SITL 用已知轨迹核对，实机另行标定
frame_alignment:
  why: ROS 局部世界系（契约 global）与 PX4 局部 NED 是**两个**局部系：轴翻转只解决「哪个轴朝哪」，原点与水平朝向不会自动一致。只做轴变换就发位置
    setpoint，量纲正确但落点无法证明，因此必须显式建立并核实对齐
  requires:
  - 位置 setpoint 仅在 frame_alignment 已建立**且**经实测残差核实后才允许下发
  - 速度/加速度 setpoint 不依赖原点，但在对齐未核实时同样不下发，避免以另一种形式继续误导
  - 核实方式：被动比较 VIO 航向与 PX4 航向的残差（要求接近水平、角速率小、样本足够且集中）
  - 生产部署应把外部视觉回传融合进 PX4 估计器（EKF 原点定义在 VIO 原点上），使平移量为 0
  modes:
    none: 不声明对齐（默认，最保守）：不下发位置 setpoint
    declared: 声明 yaw 偏移（+可选平移），仍要求实测残差核实
    identity: 显式声明两系同向且原点重合，仍要求核实
    unverified_test_only: 仅离线测试的越权开关；启动打 ERROR，绝不可用于实机
  not_verified_by_tests: 本仓库的脱机测试只验证「未核实就拦住」与「核实逻辑本身正确」；真实原点/航向关系必须用实机数据（或融合后的 EKF
    状态）确认
